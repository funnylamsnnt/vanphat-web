<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vạn Phát - Đặt Hàng Trực Tuyến & Quản Trị Kho</title>
<meta name="description" content="Công ty TNHH Tư Vấn Đầu Tư Thương Mại Vạn Phát - Đặt hàng văn phòng phẩm trực tuyến, tư vấn AI 24/7. Hotline 033 5652 832.">

<!--
  ============================================================================
  FILE NÀY LÀ GÌ?
  ============================================================================
  Đây là trang "vỏ bọc" (wrapper) để khi khách truy cập vanphatcompany.vn thì
  thấy đúng nội dung của Web App Vạn Phát Pro (đang chạy trên Google Apps
  Script tại địa chỉ script.google.com/.../exec) — mà vẫn giữ nguyên URL
  vanphatcompany.vn trên thanh địa chỉ trình duyệt, không bị nhảy sang
  script.google.com.

  Cách hoạt động: dùng 1 khung <iframe> full màn hình nhúng thẳng link Web
  App vào. Cách này CHẠY ĐƯỢC vì trong Code.gs, hàm doGet() đã bật sẵn:
      .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)
  → Google cho phép trang được nhúng trong iframe từ domain khác (mặc định
  Google CHẶN việc này, nhưng dòng lệnh trên đã mở khoá rồi).

  ANH HÀ CẦN LÀM GÌ ĐỂ FILE NÀY "SỐNG" TRÊN vanphatcompany.vn?
  1) Upload file index.html này làm TRANG CHỦ trên nơi anh lưu trữ website
     (hosting/CMS hiện tại của vanphatcompany.vn).
  2) Đảm bảo tên miền vanphatcompany.vn đang trỏ DNS về đúng nơi lưu trữ đó
     (bản ghi A hoặc CNAME tại nhà cung cấp domain).
  Việc này bắt buộc phải làm trên tài khoản hosting/domain của anh Hà — em
  không có quyền đăng nhập thay.

  MUỐN ĐỔI SANG LINK WEB APP MỚI SAU NÀY (ví dụ Deploy lại bản mới trên Apps
  Script ra link /exec khác)? Chỉ cần sửa 1 dòng DUY NHẤT bên dưới, chỗ biến
  LINK_WEB_APP, rồi upload lại là xong — không cần sửa gì khác trong file.
  ============================================================================
-->

<style>
  :root { --vp-blue: #1F4E78; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #f8fafc;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #vpFrame {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0; display: block;
    background: #fff;
  }
  #vpLoading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    background: linear-gradient(135deg, #f8fafc 0%, #e8f0f7 100%);
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  #vpLoading .vp-logo {
    font-size: 26px; font-weight: 800; color: var(--vp-blue); letter-spacing: 0.5px;
  }
  #vpLoading .vp-sub {
    font-size: 13.5px; color: #64748b;
  }
  .vp-spinner {
    width: 46px; height: 46px;
    border: 4px solid #dbe6ee;
    border-top-color: var(--vp-blue);
    border-radius: 50%;
    animation: vp-spin 0.8s linear infinite;
  }
  @keyframes vp-spin { to { transform: rotate(360deg); } }

  #vpFallback {
    display: none;
    position: fixed; inset: 0;
    z-index: 20;
    background: #f8fafc;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  #vpFallback .vp-card {
    max-width: 420px; width: 100%;
    background: #fff; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 28px 26px; text-align: center;
  }
  #vpFallback h1 { font-size: 19px; color: var(--vp-blue); margin: 6px 0 10px; }
  #vpFallback p { font-size: 13.5px; color: #475569; line-height: 1.6; margin: 0 0 18px; }
  #vpFallback a.vp-btn {
    display: inline-block; background: var(--vp-blue); color: #fff;
    padding: 12px 22px; border-radius: 8px; text-decoration: none;
    font-weight: 700; font-size: 14px;
  }
  #vpFallback a.vp-btn:hover { background: #153a5b; }
  #vpFallback .vp-hotline { margin-top: 16px; font-size: 12.5px; color: #94a3b8; }
</style>
</head>
<body>

  <!-- Màn hình chờ, hiện trong lúc iframe đang tải -->
  <div id="vpLoading">
    <div class="vp-spinner"></div>
    <div class="vp-logo">VẠN PHÁT</div>
    <div class="vp-sub">Đang tải hệ thống đặt hàng trực tuyến...</div>
  </div>

  <!-- Khung nhúng Web App thật (nội dung chính) -->
  <iframe
    id="vpFrame"
    src=""
    title="Vạn Phát - Đặt Hàng Trực Tuyến"
    allow="clipboard-write; microphone; geolocation"
    referrerpolicy="no-referrer-when-downgrade"
    style="display:none;">
  </iframe>

  <!-- Màn hình dự phòng: hiện ra nếu trình duyệt của khách chặn iframe -->
  <div id="vpFallback">
    <div class="vp-card">
      <div class="vp-logo" style="color:#1F4E78;font-weight:800;font-size:20px;">VẠN PHÁT</div>
      <h1>Không thể hiển thị trực tiếp tại đây</h1>
      <p>Trình duyệt của Quý khách đang chặn nội dung nhúng. Vui lòng bấm nút bên dưới để mở hệ thống đặt hàng trong tab mới.</p>
      <a class="vp-btn" id="vpDirectLink" href="#" target="_top">Mở Hệ Thống Đặt Hàng</a>
      <div class="vp-hotline">Hotline hỗ trợ: 033 5652 832</div>
    </div>
  </div>

  <script>
    // ==========================================================================
    // CHỈ SỬA DÒNG NÀY khi cần đổi sang link Web App khác (ví dụ Deploy bản mới):
    var LINK_WEB_APP = "https://script.google.com/macros/s/AKfycbzdcOxIbVAivc2fSCSk1v8go0Wxg_vULF7MDnsmpOcROoWDZ5luBF6uD7Wh-omRkjJB/exec";
    // ==========================================================================

    var frame = document.getElementById('vpFrame');
    var loading = document.getElementById('vpLoading');
    var fallback = document.getElementById('vpFallback');
    var directLink = document.getElementById('vpDirectLink');
    directLink.href = LINK_WEB_APP;

    var daXongChuaLoad = false;

    frame.addEventListener('load', function () {
      daXongChuaLoad = true;
      loading.style.display = 'none';
      frame.style.display = 'block';
    });

    frame.addEventListener('error', function () {
      hienFallback();
    });

    function hienFallback() {
      if (daXongChuaLoad) return;
      loading.style.display = 'none';
      frame.style.display = 'none';
      fallback.style.display = 'flex';
    }

    // Nếu sau 14 giây iframe vẫn chưa "load" được (bị chặn / mạng chậm bất thường),
    // tự động chuyển sang màn hình dự phòng thay vì để khách chờ vô thời hạn.
    setTimeout(function () {
      if (!daXongChuaLoad) hienFallback();
    }, 14000);

    // Bắt đầu tải iframe
    frame.src = LINK_WEB_APP;
  </script>
</body>
</html>
